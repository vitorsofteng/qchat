server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: as rotas do Angular sao resolvidas pelo index.html.
  location / {
    try_files $uri $uri/ /index.html;
    # O index.html aponta para os bundles pelo hash. Sem revalidacao, o navegador
    # reaproveita o documento antigo e segue rodando a versao anterior do app
    # depois de um novo deploy. Com no-cache ele confirma pelo ETag (304 barato).
    add_header Cache-Control "no-cache";
  }

  # Cache de longa duracao para os assets versionados.
  location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
