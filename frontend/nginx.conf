server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: as rotas do Angular sao resolvidas pelo index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache de longa duracao para os assets versionados.
  location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
