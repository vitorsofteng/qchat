# QChat — proxy reverso de producao (F18.3).
# Serve a aplicacao Angular e encaminha /api e /ws para o backend.

upstream qchat_backend {
    server backend:8000;
}

upstream qchat_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Health check do proprio proxy (F18.7).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API REST — o prefixo /api/ e removido antes de chegar ao backend.
    location /api/ {
        proxy_pass http://qchat_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canal WebSocket (mensagens em tempo real).
    location /ws/ {
        proxy_pass http://qchat_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Aplicacao Angular (SPA).
    location / {
        proxy_pass http://qchat_frontend;
        proxy_set_header Host $host;
    }
}

# Terminacao TLS (F18.5): apos obter os certificados (Let's Encrypt em producao
# ou mkcert em dev), monte-os em ./nginx/certs e habilite o bloco abaixo.
