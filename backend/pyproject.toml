[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qchat-backend"
version = "0.1.0"
description = "QChat — backend do sistema de chat hibrido QKD+PQC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vitor Kuhl", email = "vitor.softeng@gmail.com" }]

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "sqlalchemy==2.0.31",
    "psycopg[binary]==3.2.1",
    "pyjwt==2.8.0",
    "bcrypt==4.1.3",
    "pycryptodome==3.20.0",
    "cryptography==42.0.8",
    "python-multipart==0.0.9",
    "python-json-logger==2.0.7",
    "websockets==12.0",
]

[project.optional-dependencies]
# Extras isolados: instalacao pesada e sensivel a plataforma.
# Criptografia pos-quantica (ML-KEM) — modos ML-KEM e Hibrido.
# Nao fixamos a versao exata: a 0.15.0, usada na execucao dos experimentos
# relatados no trabalho, foi retirada do PyPI e nao e mais instalavel. O
# intervalo abaixo mantem a serie compativel e permite reinstalar o ambiente.
pqc = ["liboqs-python>=0.15,<1.0"]
# Simulacao do canal quantico (BB84) — modos BB84 e Hibrido.
qkd = ["qiskit==1.1.1", "qiskit-aer==0.14.2"]
# Conveniencia: todos os extras quanticos de uma vez.
quantum = ["liboqs-python>=0.15,<1.0", "qiskit==1.1.1", "qiskit-aer==0.14.2"]
# Analise dos experimentos (F17): graficos e estatistica.
experiments = ["matplotlib==3.9.2", "scipy==1.14.1"]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "coverage==7.5.4",
    "hypothesis==6.103.5",
    "httpx==0.27.0",
    "ruff==0.5.5",
    "black==24.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() em argumentos default

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app/crypto", "app/monitor"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
