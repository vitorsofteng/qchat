name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend — lint + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools (liboqs)
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies
        run: pip install -e ".[dev,quantum]"

      - name: Lint (ruff)
        run: ruff check app tests experiments

      - name: Format check (black)
        run: black --check app tests experiments

      - name: Tests + coverage
        run: |
          coverage run -m pytest
          coverage report

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
