# QChat — orquestracao local de desenvolvimento.
# Sobe banco + backend + frontend com um unico comando: docker compose up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qchat
      POSTGRES_PASSWORD: qchat
      POSTGRES_DB: qchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://qchat:qchat@db:5432/qchat
      JWT_SECRET: dev-insecure-secret-change-me
      # Ambas as origens locais: o environment.ts do frontend trata 127.0.0.1
      # como desenvolvimento e aponta para o backend em localhost:8000.
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      ENVIRONMENT: development
      # Adversario simulado para a demonstracao do BB84. PASSIVE por padrao;
      # use EVE_MODE=INTERCEPT_RESEND docker compose up -d backend para ativar.
      EVE_MODE: ${EVE_MODE:-PASSIVE}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
